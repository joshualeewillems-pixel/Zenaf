# Zenaf staging on Fly.io (private).
app = "zenaf-staging"
primary_region = "lax"

[build]
  dockerfile = "Dockerfile"

[env]
  ZENAF_PROD = "1"
  ZENAF_DB_DIR = "/app/data"

[http_service]
  internal_port = 8010
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    type = "http"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

[[mounts]]
  source = "zenaf_data"
  destination = "/app/data"
